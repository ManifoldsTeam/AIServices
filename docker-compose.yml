# Local development — Edu Game AI Service
# Usage:
#   docker compose up --build        # build & start
#   docker compose up -d             # start detached
#   docker compose logs -f api       # tail logs
#   docker compose down              # stop & remove
#
# Prerequisites:
#   gcloud auth application-default login  (creates ADC credentials)

services:
  api:
    build: .
    container_name: edu-game-ai
    ports:
      - "8000:8000"
    environment:
      - ENV=develop
      - PORT=8000
    volumes:
      # Mount env files
      - ./.env:/app/.env:ro
      - ./.env.develop:/app/.env.develop:ro
      # Mount gcloud config for Application Default Credentials
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
